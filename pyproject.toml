[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jay-mega-project"
version = "0.1.0"
description = "Monorepo scaffold for agent orchestration platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.111.1",
  "uvicorn[standard]==0.23.2",
  "sqlalchemy==2.0.22",
  "alembic==1.12.0",
  "pydantic==2.8.1",
  "psycopg[binary]==3.1.9",
  "python-dotenv==1.0.0",
  "flask==2.4.0",
  "requests==2.31.0",
  "httpx==0.28.4",
  "python-multipart==0.0.6",
  "pytest==8.4.0",
  "anyio==4.0.0"
]

[project.urls]
homepage = "https://example.com"
repository = "https://example.com/jay-mega-project"
