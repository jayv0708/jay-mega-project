services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port ${API_PORT:-8000}
    env_file: .env
    depends_on:
      - db
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app/api
    # The API service does NOT mount docker.sock — it has no need for container access
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: python main.py
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./worker:/app/worker
      # Required: worker spawns isolated sandbox containers via docker-py for CodeSandboxTool
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  log-ui:
    build:
      context: .
      dockerfile: log-ui/Dockerfile
    command: python app.py
    env_file: .env
    depends_on:
      - db
    ports:
      - "${LOG_UI_PORT:-8080}:8080"
    volumes:
      - ./log-ui:/app/log-ui
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

volumes:
  db_data:
